name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: apk-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ads

      # 1. Liberar espaço no runner
      - name: Free disk space
        run: |
          echo "=== Espaço antes da limpeza ==="
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images

          echo "=== Espaço depois da limpeza ==="
          df -h /

      # 2. Configurar Node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Configurar Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Instalar dependências
      - name: Install dependencies
        run: npm ci

      # 5. Gerar projeto Android
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      # 6. Compilar APK
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # 7. Salvar APK
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-do-feirante-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
